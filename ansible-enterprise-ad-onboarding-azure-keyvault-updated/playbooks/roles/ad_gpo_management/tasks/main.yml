---
- name: GPO | Check if GPO exists
  ansible.windows.win_shell: |
    Import-Module GroupPolicy -ErrorAction SilentlyContinue
    $GPO = Get-GPO -Name "{{ gpo_name }}" -ErrorAction SilentlyContinue
    if ($GPO) { Write-Output "GPO_EXISTS" } else { Write-Output "GPO_NOT_EXISTS" }
  register: gpo_check
  run_once: true
  when: 
    - not enable_dry_run | bool
    - server_exists | bool

- name: GPO | Create new GPO
  ansible.windows.win_shell: |
    Import-Module GroupPolicy -ErrorAction Stop
    New-GPO -Name "{{ gpo_name }}" -Comment "GPO for {{ application_name }} server security settings"
    Write-Output "GPO_CREATED"
  register: gpo_create
  run_once: true
  when: 
    - not enable_dry_run | bool
    - server_exists | bool
    - gpo_check is defined
    - gpo_check.stdout is defined
    - gpo_check.stdout == "GPO_NOT_EXISTS"

- name: GPO | Set creation fact when GPO exists
  ansible.builtin.set_fact:
    gpo_creation:
      stdout: "EXISTS"
  when: 
    - not enable_dry_run | bool
    - server_exists | bool
    - gpo_check is defined
    - gpo_check.stdout is defined
    - gpo_check.stdout == "GPO_EXISTS"

- name: GPO | Set creation fact when GPO is created
  ansible.builtin.set_fact:
    gpo_creation:
      stdout: "CREATED"
  when: 
    - not enable_dry_run | bool
    - server_exists | bool
    - gpo_create is defined
    - gpo_create.stdout is defined
    - gpo_create.stdout == "GPO_CREATED"

- name: GPO | Link GPO to target OU
  ansible.windows.win_shell: |
    Import-Module GroupPolicy -ErrorAction Stop
    $GPOName = "{{ gpo_name }}"
    $TargetOU = "{{ target_ou_dn }}"
    $GPO = Get-GPO -Name $GPOName
    $GPLink = Get-GPLink -Guid $GPO.Id -Domain "{{ domain_name }}" -ErrorAction SilentlyContinue
    if ($GPLink -and $GPLink.Target -eq $TargetOU) {
        Write-Output "ALREADY_LINKED"
    } else {
        New-GPLink -Name $GPOName -Target $TargetOU -LinkEnabled Yes
        Write-Output "LINKED"
    }
  register: gpo_link_result
  run_once: true
  when: 
    - not enable_dry_run | bool
    - server_exists | bool
    - (gpo_check is defined and gpo_check.stdout is defined and gpo_check.stdout == "GPO_EXISTS") or 
      (gpo_create is defined and gpo_create.stdout is defined and gpo_create.stdout == "GPO_CREATED")

- name: GPO | Set link fact default
  ansible.builtin.set_fact:
    gpo_link:
      stdout: "ALREADY_LINKED"
  when: 
    - not enable_dry_run | bool
    - server_exists | bool
    - gpo_link_result is not defined

- name: GPO | Set link fact from result
  ansible.builtin.set_fact:
    gpo_link:
      stdout: "{{ gpo_link_result.stdout }}"
  when: 
    - not enable_dry_run | bool
    - server_exists | bool
    - gpo_link_result is defined
    - gpo_link_result.stdout is defined