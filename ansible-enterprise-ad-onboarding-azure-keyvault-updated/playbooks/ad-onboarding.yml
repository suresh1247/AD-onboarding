---
- name: ENTERPRISE ACTIVE DIRECTORY ONBOARDING
  hosts: domain_controllers
  gather_facts: no
  vars:
    # Azure Key Vault Configuration
    azure_rest_api_version: "7.0"
    
    # Default values
    enable_dry_run: false
    ad_retries: 3
    ad_delay: 5
    
    # CHANGE MANAGEMENT CONFIGURATION
    # Set to false for development/testing, true for production
    require_change_ticket: false  # CHANGE THIS TO TRUE FOR PRODUCTION
    default_ticket_id: "CHG-DEV-{{ lookup('password', '/dev/null length=6 chars=hex') | upper }}"
    
    # Operation tracking with complete audit trail
    operation_id: "{{ lookup('password', '/dev/null length=12 chars=hex') | upper }}"
    operation_start_time: "{{ ansible_date_time.epoch }}"
    operation_requester: "{{ lookup('env', 'USER') | default('unknown') }}"
    operation_ticket: "{{ change_ticket_id | default(default_ticket_id) }}"
    operation_approver: "{{ change_approver | default('DEV-AUTO-APPROVED') }}"
    
    # Validation patterns - Strict allow-list
    server_name_pattern: '^[A-Za-z][A-Za-z0-9-]{2,14}$'
    app_name_pattern: '^[A-Za-z][A-Za-z0-9_]{2,30}$'
    domain_name_pattern: '^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'
    
    # Base OU path
    ou_base_dn: "DC={{ domain_name.replace('.', ',DC=') }}"
    
    # Reporting defaults
    ou_creation: { stdout: "EXISTS" }
    group_creation: { stdout: "EXISTS" }
    opsintel_add: { stdout: "ALREADY_MEMBER" }
    gpo_creation: { stdout: "EXISTS" }
    gpo_link: { stdout: "ALREADY_LINKED" }
    restricted_group_config: { stdout: "CONFIGURED" }
    gpupdate_result: { stdout: "INITIATED" }
    server_move: { stdout: "NOT_MOVED" }
    verify_restricted_group: { stdout: "VERIFIED" }
    
    # Service Account (No Domain Admin)
    service_account_dn: "CN=svc-aap-automation,OU=Service Accounts,{{ ou_base_dn }}"

  pre_tasks:
    # ============================================
    # 1. SAFETY: CHANGE MANAGEMENT & APPROVAL
    # ============================================
    - name: SAFETY | Display change management mode
      ansible.builtin.debug:
        msg: |
          ==========================================
          🔍 CHANGE MANAGEMENT MODE
          ==========================================
          Ticket Required: {{ 'YES' if require_change_ticket else 'NO (DEV MODE)' }}
          Ticket ID: {{ operation_ticket }}
          Approver: {{ operation_approver }}
          ==========================================
      delegate_to: localhost
      connection: local
      run_once: true

    - name: SAFETY | Validate change ticket (Production Mode)
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ CHANGE TICKET REQUIRED ❌
          ==========================================
          change_ticket_id must be provided for production changes.
          
          To bypass this in development, set:
          require_change_ticket: false
          ==========================================
      when: 
        - require_change_ticket | bool
        - change_ticket_id is not defined or change_ticket_id == ''
      delegate_to: localhost
      connection: local
      run_once: true

    - name: SAFETY | Validate change approver (Production Mode)
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ CHANGE APPROVER REQUIRED ❌
          ==========================================
          change_approver must be provided for production changes.
          
          To bypass this in development, set:
          require_change_ticket: false
          ==========================================
      when: 
        - require_change_ticket | bool
        - change_approver is not defined or change_approver == ''
      delegate_to: localhost
      connection: local
      run_once: true

    - name: SAFETY | Require explicit approval
      ansible.builtin.assert:
        that:
          - requester_confirmation | upper == 'YES'
        fail_msg: |
          ==========================================
          ❌ CHANGE APPROVAL REQUIRED ❌
          ==========================================
          requester_confirmation must be YES
          Current value: {{ requester_confirmation }}
          ==========================================
        success_msg: "✓ Change approval confirmed"
      delegate_to: localhost
      connection: local
      run_once: true

    # ============================================
    # 2. AZURE KEY VAULT - SECURE RETRIEVAL
    # ============================================
    - name: AZURE | Retrieve credentials securely
      ansible.builtin.set_fact:
        keyvault_name: "{{ lookup('env', 'KEYVAULT_NAME') | default('') }}"
        azure_client_id: "{{ lookup('env', 'AZURE_CLIENT_ID') | default('') }}"
        azure_client_secret: "{{ lookup('env', 'AZURE_CLIENT_SECRET') | default('') }}"
        azure_tenant_id: "{{ lookup('env', 'AZURE_TENANT_ID') | default('') }}"
        azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default('') }}"
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Validate Azure credentials
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE CREDENTIALS NOT FOUND ❌
          ==========================================
          Please ensure credential "Azure Service Principal" is added to the Job Template.
          ==========================================
      when: 
        - keyvault_name == '' or azure_client_id == '' or azure_client_secret == '' 
        - azure_tenant_id == '' or azure_subscription_id == ''
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Get Azure Access Token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ azure_tenant_id }}/oauth2/v2.0/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_client_secret }}"
          scope: "https://vault.azure.net/.default"
          grant_type: "client_credentials"
        validate_certs: yes
        timeout: 30
        status_code: 200
      register: token_response
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Fail if token retrieval failed
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AZURE AUTHENTICATION FAILED ❌
          ==========================================
          Status: {{ token_response.status }}
          Correlation ID: {{ token_response.x_ms_request_id | default('N/A') }}
          ==========================================
      when: token_response.status != 200
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Set access token
      ansible.builtin.set_fact:
        azure_access_token: "{{ token_response.json.access_token }}"
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Retrieve AD credentials from Key Vault
      ansible.builtin.uri:
        url: "https://{{ keyvault_name }}.vault.azure.net/secrets/{{ item }}?api-version={{ azure_rest_api_version }}"
        method: GET
        headers:
          Authorization: "Bearer {{ azure_access_token }}"
        validate_certs: yes
        timeout: 30
        return_content: yes
        status_code: 200
      loop:
        - "ad-service-account-username"
        - "ad-service-account-password"
        - "ad-domain-name"
      register: ad_secret_result
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Set AD credentials (minimal lifetime)
      ansible.builtin.set_fact:
        ad_username: "{{ (ad_secret_result.results | selectattr('item', 'equalto', 'ad-service-account-username') | first).json.value }}"
        ad_password: "{{ (ad_secret_result.results | selectattr('item', 'equalto', 'ad-service-account-password') | first).json.value }}"
        ad_domain_name: "{{ (ad_secret_result.results | selectattr('item', 'equalto', 'ad-domain-name') | first).json.value }}"
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Fail if AD credentials not retrieved
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ AD SERVICE ACCOUNT CREDENTIALS NOT FOUND ❌
          ==========================================
          Could not retrieve AD credentials from Key Vault: {{ keyvault_name }}
          ==========================================
      when: 
        - ad_username == '' or ad_password == '' or ad_domain_name == ''
      delegate_to: localhost
      connection: local
      run_once: true

    - name: AZURE | Clear sensitive variables immediately
      ansible.builtin.set_fact:
        azure_client_secret: ""
        azure_access_token: ""
      no_log: true
      delegate_to: localhost
      connection: local
      run_once: true

    # ============================================
    # 3. WINRM - SECURE CONNECTION
    # ============================================
    - name: CONNECTION | Set secure WinRM variables
      ansible.builtin.set_fact:
        ansible_user: "{{ ad_username }}"
        ansible_password: "{{ ad_password }}"
        ansible_connection: winrm
        # For production: Use HTTPS and validation
        # For development: Fallback to HTTP if needed
        ansible_winrm_transport: credssp
        ansible_winrm_server_cert_validation: "{{ 'validate' if enable_winrm_https | default(true) else 'ignore' }}"
        ansible_port: "{{ 5986 if enable_winrm_https | default(true) else 5985 }}"
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 120
        ansible_become_method: runas
        ansible_become_user: SYSTEM
      no_log: true
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    - name: CONNECTION | Gather facts from Windows host
      ansible.builtin.setup:
        gather_subset:
          - min
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    - name: CONNECTION | Test connectivity
      ansible.windows.win_ping:
      register: ping_test
      until: ping_test is success
      retries: "{{ ad_retries }}"
      delay: "{{ ad_delay }}"
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    - name: CONNECTION | Verify Active Directory module
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory -ErrorAction Stop
        Get-ADDomain | Select-Object DNSRoot
      register: ad_verify
      until: ad_verify is success
      retries: "{{ ad_retries }}"
      delay: "{{ ad_delay }}"
      changed_when: false
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    # ============================================
    # 4. INPUT VALIDATION - STRICT ALLOW-LIST
    # ============================================
    - name: VALIDATION | Validate required parameters
      ansible.builtin.assert:
        that:
          - server_name is defined and server_name != ''
          - application_name is defined and application_name != ''
          - domain_name is defined and domain_name != ''
        fail_msg: "Missing required parameters"
        success_msg: "✓ Input validation passed"

    - name: VALIDATION | Validate server name format
      ansible.builtin.assert:
        that:
          - server_name is match(server_name_pattern)
        fail_msg: "Invalid server name format: {{ server_name }}"
        success_msg: "✓ Server name validation passed"

    - name: VALIDATION | Validate application name format
      ansible.builtin.assert:
        that:
          - application_name is match(app_name_pattern)
        fail_msg: "Invalid application name format: {{ application_name }}"
        success_msg: "✓ Application name validation passed"

    - name: VALIDATION | Validate domain name format
      ansible.builtin.assert:
        that:
          - domain_name is match(domain_name_pattern)
        fail_msg: "Invalid domain name format: {{ domain_name }}"
        success_msg: "✓ Domain name validation passed"

    - name: VALIDATION | Check for dry run mode
      ansible.builtin.debug:
        msg: "⚠️ DRY RUN MODE ENABLED - Preview only, no changes will be made"
      when: enable_dry_run | bool

    # ============================================
    # 5. SERVER EXISTENCE - RESOLVE ONCE, USE IMMUTABLE ID
    # ============================================
    - name: SERVER | Resolve server ObjectGUID
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory -ErrorAction SilentlyContinue
        $Computer = Get-ADComputer -Filter "Name -eq '{{ server_name }}'" -Properties DistinguishedName, CanonicalName, Enabled, ObjectGUID -ErrorAction SilentlyContinue
        if ($Computer) {
            $Result = @{
                Exists = $true
                DN = $Computer.DistinguishedName
                CanonicalName = $Computer.CanonicalName
                Enabled = $Computer.Enabled
                ObjectGUID = $Computer.ObjectGUID.ToString()
            }
            $Result | ConvertTo-Json
        } else {
            '{"Exists": false}'
        }
      register: server_search
      changed_when: false
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    - name: SERVER | Parse server information
      ansible.builtin.set_fact:
        server_exists: "{{ (server_search.stdout | from_json).Exists | default(false) }}"
        server_canonical: "{{ (server_search.stdout | from_json).CanonicalName | default('N/A') }}"
        server_enabled: "{{ (server_search.stdout | from_json).Enabled | default(false) }}"
        server_guid: "{{ (server_search.stdout | from_json).ObjectGUID | default('') }}"
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    - name: SERVER | Display server status
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "SERVER: {{ server_name }}"
          - "ObjectGUID: {{ server_guid }}"
          - "Exists in AD: {{ 'YES' if server_exists else 'NO' }}"
          - "Location: {{ server_canonical }}"
          - "Status: {{ 'Enabled' if server_enabled else 'Disabled' if server_exists else 'N/A' }}"
          - "=========================================="
      when: 
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    - name: SERVER | Stop playbook when server is not found
      ansible.builtin.fail:
        msg: |
          ==========================================
          ❌ SERVER NOT FOUND ❌
          ==========================================
          Server '{{ server_name }}' was not found in Active Directory.
          No changes will be made.
          Operation ID: {{ operation_id }}
          Ticket: {{ operation_ticket }}
          ==========================================
      when: 
        - not server_exists | bool
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

    # ============================================
    # 6. DYNAMIC CONFIGURATION
    # ============================================
    - name: SERVER | Set dynamic configuration
      ansible.builtin.set_fact:
        server_type: "{{ 'SQL' if 'SQL' in server_name | upper else 'NON-SQL' }}"
        target_ou_dn: >-
          {{
            ('OU=' + application_name + ',OU=SQL,OU=Servers,OU=LKM,' + ou_base_dn)
            if ('SQL' in server_name | upper)
            else ('OU=' + application_name + ',OU=Servers,OU=LKM,' + ou_base_dn)
          }}
        app_prefix: "{{ application_name[:3] | upper }}"
        # Unique naming with GUID to prevent collisions
        ad_group_name: "{{ application_name[:3] | upper }}-PAM-{{ application_name }}{{ 'SQL' if ('SQL' in server_name | upper) else '' }}-{{ operation_id[:6] }}"
        gpo_name: "{{ application_name[:3] | upper }}-SRV-{{ application_name }}{{ 'SQL' if ('SQL' in server_name | upper) else '' }}-{{ operation_id[:6] }}"
      when: 
        - server_exists | bool
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''

  tasks:
    # ============================================
    # 7. AD ONBOARDING EXECUTION
    # ============================================
    - name: MAIN | Execute AD onboarding
      block:
        - name: Include validation role
          ansible.builtin.include_role:
            name: ad_validation
          when: 
            - server_exists | bool
            - not enable_dry_run | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

        - name: Include OU management role
          ansible.builtin.include_role:
            name: ad_ou_management
          when: 
            - server_exists | bool
            - not enable_dry_run | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

        - name: Include computer management role
          ansible.builtin.include_role:
            name: ad_computer_management
          when: 
            - server_exists | bool
            - not enable_dry_run | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

        - name: Include group management role
          ansible.builtin.include_role:
            name: ad_group_management
          when: 
            - server_exists | bool
            - not enable_dry_run | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

        - name: Include GPO management role
          ansible.builtin.include_role:
            name: ad_gpo_management
          when: 
            - server_exists | bool
            - not enable_dry_run | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

        - name: Include restricted groups role
          ansible.builtin.include_role:
            name: ad_restricted_groups
          when: 
            - server_exists | bool
            - not enable_dry_run | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

        - name: Include reporting role
          ansible.builtin.include_role:
            name: ad_reporting
          when: 
            - server_exists | bool
            - ad_username is defined and ad_username != ''
            - ad_password is defined and ad_password != ''

      when: 
        - server_exists | bool
        - ad_username is defined and ad_username != ''
        - ad_password is defined and ad_password != ''
      rescue:
        - name: MAIN | Capture structured error
          ansible.builtin.set_fact:
            operation_error: "{{ ansible_failed_result.msg | default('Unknown error') }}"
          when: ansible_failed_result is defined

        - name: MAIN | Log failure with context
          ansible.builtin.debug:
            msg: |
              ==========================================
              ❌ AD ONBOARDING FAILED ❌
              ==========================================
              Operation ID: {{ operation_id }}
              Ticket: {{ operation_ticket }}
              Server: {{ server_name }}
              Error: {{ operation_error | default('Unknown error') }}
              ==========================================
          when: operation_error is defined

  post_tasks:
    - name: REPORT | Server not found summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "❌ AD ONBOARDING CANCELLED"
          - "=========================================="
          - "Operation ID: {{ operation_id }}"
          - "Ticket: {{ operation_ticket }}"
          - "Server: {{ server_name }}"
          - "Status: Not Found in Active Directory"
          - "=========================================="
      when: not server_exists | bool

    - name: AZURE | Cleanup - Clear sensitive variables
      ansible.builtin.set_fact:
        ad_password: ""
        azure_access_token: ""
      no_log: true
      when: keyvault_name != ""
      delegate_to: localhost
      connection: local
      run_once: true